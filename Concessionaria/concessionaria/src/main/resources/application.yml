spring:
  application:
    name: concessionaria

  datasource:
    url: jdbc:mysql://localhost:3306/gestione_concessionari?createDatabaseIfNotExist=true&serverTimezone=Europe/Rome
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
